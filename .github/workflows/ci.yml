name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pixi (Hugo, Go, Node, Dart Sass, Python)
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.63.2
          cache: true

      - name: Install Docsy npm dependencies
        run: pixi run npm-deps

      - name: Lint and test (Python scripts, JS)
        run: pixi run lint && pixi run test && pixi run test-js

      - name: Build (redraws the node map first)
        run: pixi run build

      - name: Check the committed node map is up to date
        run: git diff --exit-code assets/images/hero-map.svg || { echo "::error::Run 'pixi run map' and commit assets/images/hero-map.svg"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: ./public
          retention-days: 7
