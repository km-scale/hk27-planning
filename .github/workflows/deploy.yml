name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pixi (Hugo, Go, Node, Dart Sass, Python)
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.63.2
          cache: true

      - name: Install Docsy npm dependencies
        run: pixi run npm-deps

      - name: Lint and test scripts
        run: pixi run lint && pixi run test

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        run: pixi run build --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: ./public
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
